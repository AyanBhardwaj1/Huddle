name: Keep the engine awake

# Render's free plan puts the engine to sleep after ~15 idle minutes, and the first visitor then waits
# up to a minute. Pinging /health every 5 minutes keeps it warm. Free for public repos.
# Override the URL with a repository variable named ENGINE_URL (Settings > Secrets and variables > Variables).
# Note: GitHub pauses scheduled workflows after 60 days without repository activity.

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions: {}

concurrency:
  group: keepalive
  cancel-in-progress: true

jobs:
  ping:
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    env:
      ENGINE_URL: ${{ vars.ENGINE_URL || 'https://huddle-engine-p1fc.onrender.com' }}
    steps:
      - name: Ping the engine
        run: |
          for i in 1 2 3; do
            if curl -fsS -m 90 "$ENGINE_URL/health"; then echo; echo "engine is awake"; exit 0; fi
            sleep 15
          done
          # Warn instead of failing so a Render outage does not email a failure every 5 minutes.
          echo "::warning::$ENGINE_URL did not answer /health after 3 tries"
