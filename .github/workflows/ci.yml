name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      # Package tests + root script tests (QuickNode filter and webhook). The on-chain Anchor tests
      # need the Solana toolchain and a local validator; run them with `pnpm solana:test` locally.
      - run: pnpm test
      - name: Build the box UI and the player app
        run: pnpm --filter @huddle/box --filter @huddle/player build
      - name: Install Chromium for Playwright
        run: pnpm exec playwright install --with-deps --only-shell chromium
      - run: pnpm e2e
        env:
          CI: '1'
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
